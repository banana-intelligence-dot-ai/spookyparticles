<!doctype html>
<!-- Spooky Particles card for natepeace.com and bananaintelligence.ai, 1600 x 1000. The live home page's first screen:
     its headline and the Einstein ink drawing (public domain source, see apps/web/public/einstein-ink.md). -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Geist"; src: url("../../node_modules/geist/dist/fonts/geist-sans/Geist-Medium.ttf"); font-weight: 500; }
@font-face { font-family: "Geist Mono"; src: url("../../node_modules/geist/dist/fonts/geist-mono/GeistMono-Regular.ttf"); font-weight: 400; }
html, body { margin: 0; background: #0a0a0b; }
.card { position: relative; width: 1600px; height: 1000px; overflow: hidden; background: #0a0a0b; color: #f2f2ef; }
.portrait { position: absolute; left: 770px; top: -96px; width: 1000px; aspect-ratio: 1000 / 1199;
  background: url("../../apps/web/public/einstein-ink.png") center / contain no-repeat; opacity: 0.46;
  -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 18%), linear-gradient(to bottom, #000 52%, transparent 84%);
  -webkit-mask-composite: source-in; mask-composite: intersect; }
.scrim { position: absolute; inset: 0; background: linear-gradient(to right, #0a0a0b 0%, rgb(10 10 11 / 0.82) 38%, rgb(10 10 11 / 0) 74%); }
.copy { position: absolute; left: 128px; top: 322px; }
.quote { font-family: "Geist Mono"; font-size: 30px; line-height: 1; color: #9b9da3; letter-spacing: 0; }
.quote span { color: #80848b; margin-left: 22px; }
h1 { margin: 62px 0 0; font-family: "Geist"; font-weight: 500; font-size: 124px; line-height: 1.02; letter-spacing: -0.025em; }
h1 span { display: block; color: #9b9da3; }
</style></head>
<body><div class="card">
  <div class="portrait"></div>
  <div class="scrim"></div>
  <div class="copy">
    <div class="quote">“spooky action at a distance”<span>Einstein, 1947</span></div>
    <h1>Fixed by the time <span>you realize it’s broken.</span></h1>
  </div>
</div></body></html>
