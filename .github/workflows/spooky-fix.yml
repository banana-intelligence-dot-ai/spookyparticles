name: Spooky fix
on:
  workflow_dispatch:
    inputs:
      project:
        description: Project
        required: true
        type: string
      check:
        description: Check
        required: true
        type: string
      what:
        description: What broke
        required: true
        type: string
      link:
        description: Spooky jobs link
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write
concurrency:
  # One run per check, so a second break waits instead of being dropped.
  group: spooky-fix-${{ inputs.check }}
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          # Runs on your Claude plan: save the output of `claude setup-token` as this repository secret.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # This run's own GitHub token, so the action needs no extra GitHub app or OIDC permission.
          github_token: ${{ github.token }}
          # Spooky's GitHub app starts this run, and the action refuses bots unless named here.
          allowed_bots: spooky-particles
          # Or bill an API key instead: anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: --model claude-opus-5-5 --max-turns 60 --allowedTools "Read,Edit,Write,Grep,Glob,Bash(git:*),Bash(npm test:*),Bash(npm run:*),Bash(npx:*),Bash(pnpm:*),Bash(yarn:*),Bash(bun:*),Bash(make:*),Bash(pytest:*),Bash(python3 -m pytest:*),Bash(python -m pytest:*),Bash(python3 -m unittest:*),Bash(python -m unittest:*),Bash(uv run:*),Bash(poetry run:*),Bash(cargo:*),Bash(go:*),Bash(ls:*),Bash(grep:*),Bash(sed:*),Bash(curl:*),Bash(sleep:*)"
          prompt: |
            Spooky reports a broken check in ${{ inputs.project }}.
            Check: ${{ inputs.check }}
            What happened: ${{ inputs.what }}
            Jobs: ${{ inputs.link }}
            Read .spooky/lessons.md first; create it if it is missing. Find the cause in the code, logs, and recent commits. Make the smallest fix.
            Judge the fix only by this project's existing tests and checks, as they are on the default branch. Never edit, skip or delete a test, CI workflow or check config to make it pass. You may add a new test. If a check itself is wrong, open a pull request for a person and stop.
            Run this project's own tests. After three attempts that fail, stop: change nothing on the default branch, and open a pull request with what you tried and the failing output, so a person can take over.
            End every commit message with a line "Verified: <command> <result>", or "Verified: none, <why>".
            Commit and ship only as CLAUDE.md or AGENTS.md allows; otherwise open a pull request.
            Add one dated line to .spooky/lessons.md: what broke, the real cause, and what fixed it or why you stopped. Never print secrets.
      # The fix can't grade itself: flag a run whose commits changed checks or skipped the "Verified:" line.
      # A new gate only warns until its false alarms are gone; then it fails the run.
      - name: Check the fix against the rules
        if: always()
        shell: bash
        env:
          START: ${{ github.sha }}
        run: |
          set -uo pipefail
          git rev-list --branches --not "$START" > "$RUNNER_TEMP/commits.txt"
          [ -s "$RUNNER_TEMP/commits.txt" ] || { echo "No new commits." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          bad=0
          while read -r c; do
            git diff-tree --no-commit-id --name-status -r "$c" | awk -F'\t' '$1 ~ /^(M|D|R|T)/ {print $2}' >> "$RUNNER_TEMP/touched.txt"
            if ! git log -1 --format=%B "$c" | grep -q '^Verified: '; then
              echo "Commit ${c:0:7} has no \"Verified:\" line." >> "$GITHUB_STEP_SUMMARY"; bad=1
            fi
          done < "$RUNNER_TEMP/commits.txt"
          if grep -E '(^|/)(\.github/|tests?/|__tests__/)|\.(test|spec)\.[A-Za-z]+$|_test\.(go|py)$|(^|/)test_[^/]*\.py$|(^|/)(vitest|jest|playwright)\.config\.|(^|/)(pytest\.ini|conftest\.py)$' "$RUNNER_TEMP/touched.txt" > "$RUNNER_TEMP/checks.txt" 2>/dev/null; then
            { echo "The fix changed or deleted existing checks, so a person must review it:"; sed 's/^/- /' "$RUNNER_TEMP/checks.txt"; } >> "$GITHUB_STEP_SUMMARY"; bad=1
          fi
          if [ "$bad" = 1 ]; then echo "::warning title=Spooky fix rules::This fix needs a person's review. See the run summary."; fi
          exit 0
